<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="canonical" href="https://gabrielecompagni.com/" />
<link rel="preload" as="image" href="cover-gabriele-compagni-fashion-photographer-video-director.webp" type="image/webp" fetchpriority="high" />
<link rel="preload" href="https://fonts.gstatic.com/s/zillaslab/v12/dFa6ZfeM_74wlPZtksIFajo6_V6LVlA.woff2" as="font" type="font/woff2" crossorigin />

<!-- ═══════════════════════════════════════════════════════════════
     GABRIELE COMPAGNI — home page
     Da personalizzare in 4 punti (cerca "◆ DA MODIFICARE"):
       1. I 3 link  →  portfolio (Dropbox), vimeo, bio
       2. La foto di sfondo (opzionale: se la lasci vuota resta nero)
       3. og:image  →  la stessa foto, per l'anteprima quando condividi il link
     Tutto il resto è già a posto.
     ═══════════════════════════════════════════════════════════════ -->

<title>Gabriele Compagni — Photographer &amp; Video Director</title>
<meta name="description" content="Gabriele Compagni is a photographer and video director working across personal art projects, fashion editorials, commercial campaigns, portraits and film." />

<!-- Anteprima quando incolli il link (WhatsApp, Instagram DM, email di outreach) -->
<meta property="og:title" content="Gabriele Compagni — Photographer &amp; Video Director" />
<meta property="og:description" content="Photography, personal art projects, fashion editorials, commercial campaigns and film." />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  @font-face {
    font-family: "Zilla Slab";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("https://fonts.gstatic.com/s/zillaslab/v12/dFa6ZfeM_74wlPZtksIFajo6_V6LVlA.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    /* ◆ DA MODIFICARE (2) — foto di sfondo.
       Incolla l'url tra le parentesi:  url("https://.../foto.jpg")
       Lascia "none" per lo sfondo nero della copertina. */
    --bg-image: url("cover-gabriele-compagni-fashion-photographer-video-director.webp");

    --black:   #000000;
    --white:   #f6f6f3;  /* bianco unico: nome + tagline, come nella copertina */
    --cream:   #f6f6f3;  /* (stesso bianco: niente due-toni) */
    --muted:   #8c8c88;  /* grigio neutro dei link a riposo */

    --pad: clamp(1.5rem, 4.5vw, 3.5rem);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: "American Typewriter", "Zilla Slab", "Rockwell", "Courier New", serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  /* ── Sfondo: foto trattata scura, o nero pieno se assente ── */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: var(--black) var(--bg-image) center / cover no-repeat;
  }
  .bg::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    /* scurisce alto (headline) e basso (link) e il lato sinistro dove sta il testo,
       lasciando visibile la modella al centro-destra */
    background:
      linear-gradient(180deg,
        rgba(0,0,0,.68) 0%,  rgba(0,0,0,.30) 32%,
        rgba(0,0,0,.32) 62%, rgba(0,0,0,.80) 100%),
      linear-gradient(100deg,
        rgba(0,0,0,.58) 0%, rgba(0,0,0,.30) 40%, rgba(0,0,0,0) 68%);
  }

  /* ── Impaginazione: statement in alto, link in basso ── */
  .frame {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    padding: var(--pad);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .statement {
    font-weight: 400;
    font-size: max(13px, 4vw);      /* mobile e tablet: scala con la larghezza */
    line-height: 1.08;
    letter-spacing: -0.012em;
  }
  /* desktop: dimensione fissa e contenuta */
  @media (min-width: 1200px) {
    .statement { font-size: 3rem; }
  }
  /* mobile: più aria per la riga lunga e link comodi da toccare */
  @media (max-width: 600px) {
    .frame { padding: clamp(1.25rem, 5vw, 2rem); }
    .links { gap: 1.6rem; }
    .links a { padding: .3rem 0; }
  }
  .statement .name    { display: block; color: var(--white); }
  .statement .tagline { display: block; color: var(--cream); }

  .intro {
    position: absolute;
    left: var(--pad);
    right: var(--pad);
    bottom: calc(var(--pad) + 3.5rem);
    max-width: 52rem;
    color: var(--muted);
    font-size: 12px;
    font-weight: 400;
    line-height: 1.45;
  }
  .desktop-break { display: none; }

  @media (min-width: 601px) {
    .desktop-break { display: inline; }
  }

  @media (max-width: 600px) {
    .intro {
      left: clamp(1.25rem, 5vw, 2rem);
      right: clamp(1.25rem, 5vw, 2rem);
      bottom: calc(clamp(1.25rem, 5vw, 2rem) + 3.8rem);
    }
  }

  /* ── Link ── */
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(1.4rem, 3.5vw, 2.8rem);
    font-size: clamp(1rem, 1.5vw, 1.15rem);
    font-weight: 400;
    letter-spacing: 0.01em;
  }
  .links a {
    position: relative;
    color: var(--muted);
    text-decoration: none;
    padding-bottom: 2px;
    transition: color .35s ease;
  }
  .links a::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 1px;
    background: var(--cream);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .35s ease;
  }
  .links a:hover,
  .links a:focus-visible { color: var(--cream); }
  .links a:hover::after,
  .links a:focus-visible::after { transform: scaleX(1); }

  .links a:focus-visible {
    outline: 1px solid var(--cream);
    outline-offset: 6px;
  }

  @media (prefers-reduced-motion: reduce) {
    .links a, .links a::after { transition: none; }
  }
</style>
</head>

<body>
  <div class="bg"></div>

  <main class="frame">
    <h1 class="statement">
      <span class="name">gabriele compagni:</span>
      <span class="tagline">seeking the strength beauty into<br>the human essence</span>
    </h1>

    <p class="intro">Gabriele Compagni is an Italian photographer and video director working across Milan and New York,<br class="desktop-break"> creating photography and film for fashion, commercial campaigns and personal art projects.</p>

    <nav class="links" aria-label="Portfolio">
      <a href="portfolio.html">portfolio</a>
      <a href="https://vimeo.com/gabrielecompagni">films</a>
      <a href="bio.html">bio</a>
    </nav>
  </main>
</body>
</html>
