<style>
  @font-face {
    font-family:"Zilla Slab";
    font-style:normal;
    font-weight:400;
    font-display:swap;
    src:url("https://fonts.gstatic.com/s/zillaslab/v12/dFa6ZfeM_74wlPZtksIFajo6_V6LVlA.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }

  :root{
    --black:#000; --white:#f6f6f3; --muted:#8c8c88;
    --pad:clamp(1.25rem, 4.5vw, 3.5rem);
    --gap:clamp(.4rem, 1.5vw, 1.2rem);
    --maxw:1500px;
    --masthead-h:0px;
    --ff:"American Typewriter","Zilla Slab","Rockwell","Courier New",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{ background:var(--black); color:var(--white); font-family:var(--ff); font-weight:400; -webkit-font-smoothing:antialiased; }

  /* ── Intestazione fissa ── */
  .masthead{
    position:sticky; top:0; z-index:10;
    width:min(100%, 1400px); margin-inline:auto;
    display:flex; justify-content:space-between; align-items:center;
    padding:var(--pad);
    background:var(--black);
    font-size:clamp(.72rem, 1vw, .82rem); letter-spacing:.14em; text-transform:uppercase;
  }
  .masthead a{color:var(--white);text-decoration:none;transition:color .3s ease}
  .masthead a:first-child{position:relative}
  .masthead a:first-child::before{
    content:"";position:absolute;left:50%;top:50%;width:48px;height:44px;
    transform:translate(-50%,-50%);
  }
  .masthead a:hover,.masthead a:focus-visible{color:var(--muted)}
  .masthead a:focus-visible{outline:1px solid var(--white);outline-offset:5px}
  .masthead .tag{color:var(--muted)}

  /* ── Pagine che scorrono ── */
  .gallery{ max-width:var(--maxw); margin:0 auto; padding-bottom:var(--gap); display:flex; flex-direction:column; gap:var(--gap); }
  /* cursore ⤢ "espandi": freccia doppia diagonale verso l'esterno, nera */
  .gallery img{
    width:auto; height:auto; display:block;
    max-width:100%;
    max-height:calc(100vh - var(--masthead-h) - 40px);
    max-height:calc(100dvh - var(--masthead-h) - 40px);
    object-fit:contain;
    margin-inline:auto;
    cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"><g fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 16"/><path d="M4 11V4h7"/><path d="M20 13v7h-7"/></g></svg>') 6 6, zoom-in;
  }

  /* ── Overlay a tutto schermo (lightbox) ── */
  /* cursore ⤡ "riduci": freccia doppia diagonale verso l'interno, nera */
  .lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(0,0,0,.96);
    display:none; align-items:center; justify-content:center;
    padding:clamp(.5rem, 2vw, 2rem);
    cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"><g fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l6 6"/><path d="M10 4V10H4"/><path d="M20 20l-6-6"/><path d="M14 20V14H20"/></g></svg>') 6 6, zoom-out;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:100%; max-height:100%;
    object-fit:contain;
    display:block;
  }
  .lightbox .nav-zone{
    position:fixed; z-index:101;
    background:transparent; border:0; padding:0;
    outline:none;
    -webkit-tap-highlight-color:transparent;
  }
  .lightbox .nav-zone.prev{ cursor:w-resize; }
  .lightbox .nav-zone.next{ cursor:e-resize; }
  .lightbox .nav-zone.dismiss{
    cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"><g fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l6 6"/><path d="M10 4V10H4"/><path d="M20 20l-6-6"/><path d="M14 20V14H20"/></g></svg>') 6 6, zoom-out;
  }
  .lightbox .close{
    position:fixed; z-index:102; top:clamp(1rem,3vw,2rem); right:clamp(1rem,3vw,2rem);
    color:var(--white); font-size:1.6rem; line-height:1;
    background:none; border:0; cursor:pointer; padding:.3rem;
    font-family:var(--ff);
  }
  .lightbox .close::before{
    content:"";position:absolute;left:50%;top:50%;width:48px;height:48px;
    transform:translate(-50%,-50%);
  }
  .lightbox .close:hover{ color:var(--muted); }

  /* ── Responsive ── */
  @media (max-width: 900px){ .masthead{ font-size:.7rem; letter-spacing:.12em; } :root{ --gap:.4rem; } }
  @media (max-width: 600px){
    .masthead{
      align-items:baseline;
      padding:1.5rem;
      font-size:.72rem;
      letter-spacing:.14em;
    }
    :root{ --gap:.3rem; }
    .gallery img{ width:100%; max-height:none; }
  }
</style>

  <!-- Overlay per l'ingrandimento a tutto schermo -->
  <div class="lightbox" id="lightbox">
    <button class="close" id="close" aria-label="Chiudi">&times;</button>
    <img id="lightbox-img" src="" alt="" />
    <button class="nav-zone prev" id="previous-page" aria-label="Pagina precedente"></button>
    <button class="nav-zone dismiss" id="dismiss-lightbox" aria-label="Chiudi immagine ingrandita"></button>
    <button class="nav-zone next" id="next-page" aria-label="Pagina successiva"></button>
  </div>

  <script>
    (function(){
      var lb = document.getElementById('lightbox');
      var lbImg = document.getElementById('lightbox-img');
      var gallery = document.getElementById('gallery');
      var pages = gallery.querySelectorAll('img');
      var currentIndex = 0;
      var previousPage = document.getElementById('previous-page');
      var dismissLightbox = document.getElementById('dismiss-lightbox');
      var nextPage = document.getElementById('next-page');
      var masthead = document.querySelector('.masthead');
      function updateMastheadHeight(){
        document.documentElement.style.setProperty('--masthead-h', masthead.offsetHeight + 'px');
      }
      updateMastheadHeight();
      window.addEventListener('resize', updateMastheadHeight);
      function show(index){
        currentIndex = (index + pages.length) % pages.length;
        lbImg.src = pages[currentIndex].dataset.full;
        lbImg.alt = pages[currentIndex].alt;
        if(lbImg.complete) requestAnimationFrame(updateNavigationZones);
      }
      function updateNavigationZones(){
        if(!lb.classList.contains('open')) return;
        var rect = lbImg.getBoundingClientRect();
        var width = rect.width / 3;
        [previousPage, dismissLightbox, nextPage].forEach(function(zone, index){
          zone.style.left = (rect.left + width * index) + 'px';
          zone.style.top = rect.top + 'px';
          zone.style.width = width + 'px';
          zone.style.height = rect.height + 'px';
        });
      }
      function open(index){ lb.classList.add('open'); document.body.style.overflow='hidden'; show(index); }
      function close(){ lb.classList.remove('open'); lbImg.src=''; document.body.style.overflow=''; }
      gallery.addEventListener('click', function(e){
        if(e.target && e.target.tagName === 'IMG'){
          open(Array.prototype.indexOf.call(pages, e.target));
        }
      });
      previousPage.addEventListener('click', function(e){ e.stopPropagation(); show(currentIndex - 1); });
      dismissLightbox.addEventListener('click', function(e){ e.stopPropagation(); close(); });
      nextPage.addEventListener('click', function(e){ e.stopPropagation(); show(currentIndex + 1); });
      lbImg.addEventListener('load', updateNavigationZones);
      window.addEventListener('resize', updateNavigationZones);
      lb.addEventListener('click', function(e){ if(e.target === lb) close(); });
      document.getElementById('close').addEventListener('click', function(e){
        e.stopPropagation();
        close();
      });
      document.addEventListener('keydown', function(e){
        if(!lb.classList.contains('open')) return;
        if(e.key === 'Escape') close();
        if(e.key === 'ArrowRight') show(currentIndex + 1);
        if(e.key === 'ArrowLeft') show(currentIndex - 1);
      });
    })();
  </script>
