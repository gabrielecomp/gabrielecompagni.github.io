    :root {
      --black: #000;
      --white: #f6f6f3;
      --muted: #8c8c88;
      --pad: clamp(1.25rem, 4.5vw, 3.5rem);
      --ff: "American Typewriter", "Zilla Slab", "Rockwell", "Courier New", serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--ff);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    .masthead {
      width: min(100%, 1400px);
      margin-inline: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--pad);
      font-size: clamp(.72rem, 1vw, .82rem);
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .masthead a { color: var(--white); text-decoration: none; transition: color .3s ease; }
    .masthead a:first-child { position: relative; }
    .masthead a:first-child::before {
      content: "";
      position: absolute;
      left: -12px;
      right: -12px;
      top: 50%;
      height: 44px;
      transform: translateY(-50%);
    }
    .masthead a:hover, .masthead a:focus-visible { color: var(--muted); }
    .masthead a:focus-visible { outline: 1px solid var(--white); outline-offset: 5px; }
    .masthead .tag { color: var(--muted); font: inherit; text-transform: none; }

    @media (max-width: 900px) {
      .masthead { font-size: .7rem; letter-spacing: .12em; }
    }
    @media (max-width: 600px) {
      .masthead {
        align-items: baseline;
        padding: 1.5rem;
        font-size: .72rem;
        letter-spacing: .14em;
      }
    }
  </style>
